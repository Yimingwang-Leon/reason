project: nemotron-reasoning-087
question: >
  Break the 0.87 LB plateau (chase 0.89) on the NVIDIA Nemotron Model Reasoning
  Challenge. The only lever is raising cryptarithm_deduce oracle above its ~13%
  (everything else is maxed) and/or pushing realization R toward 1.0.

target_metric: offline_oracle  # on data/holdout.csv (1899 problems); LB = oracle x R, R~0.958
baseline:
  lb: 0.84
  oracle: 0.890
  R: 0.958
current_best:
  lb: 0.84
  oracle: 0.890
  commit: f083ffe

constraints:
  base_model: NemotronH-30B (fixed)
  lora_rank_max: 32
  decode: greedy temp=0
  answer_format: \boxed{}
  tinker_budget_usd: ~10   # 2ep retrain ~$20; NEVER auto-spend, queue for user approval
  offline_work: free and unlimited

hypotheses:
  H1:
    desc: Does crypt fit a clean per-problem arithmetic generator WITH answers (Z3, full model space)?
    status: DONE — degenerate. Non-injective fits 100% (trivial/loose); injective ~2%. Predict-from-examples (real metric) = ~13% (agentB). Ciphers are non-injective + underdetermined -> SOLVING is capped ~13-16%. Signal: base~11, op=add dominates.
    conclusion: crypt cannot be SOLVED reliably; only H3 (teach meta-skill via synthetic data) can possibly raise it.
  H2:
    desc: Brace-cap workaround — dodge \boxed{} truncation for the 24% brace answers (1 free submission to test grader fallback)
    status: pending
  H3:
    desc: Synthetic cipher-deduction corpus teaches the meta-skill -> crypt at greedy beats the 13% solver ceiling
    status: pending (paid validation)
  H4:
    desc: Recipe deltas (lm_head if eval-supported, MoE-tie) close 0.84->0.86 gap vs public recipe
    status: pending (paid validation)
  H5:
    desc: Augmenter sub-skill drills raise R on long-CoT cats
    status: pending (paid validation)

paid_experiments_queue:
  - id: run-006
    desc: "Retrain on 89.0%-oracle corpus + H3 cryptarithm_synth augmenter. Banks the already-unrealized oracle gain (87.7->89.0) AND tests the H3 crypt meta-skill bet."
    build: "python -m src.corpus"
    train: "python -m src.train_tinker --run-name run-006 --num-epochs 2 --curriculum"
    cost_usd: ~20
    projected: "floor ~0.85 (oracle realization at R 0.958); upside 0.86-0.87 if H3 lifts crypt at greedy. NOT 0.89."
    status: NOT_RECOMMENDED — projects only ~0.853 (floor); cannot GUARANTEE 0.86 (R unmeasurable). User rule: guarantee 0.86 or do not spend. => skip run-006 until offline projection clearly exceeds 0.86. Guaranteed 0.86 = free public notebook (user forks+submits).

next_action: H3 built+staged+committed (0d75a54). Free work continues: H2 brace-cap workaround, H4 recipe-delta analysis. Paid run-006 queued for user.
